<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Протечка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/blaster-icon.svg" />
    <title>Протечка крыши</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.js" as="script" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.wasm" as="fetch" type="application/wasm" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="game-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        <div class="ui-top-controls">
          <button type="button" id="btn-fullscreen" class="btn-fullscreen" aria-label="На весь экран">
            <span class="btn-fullscreen-on" aria-hidden="true">⛶</span>
            <span class="btn-fullscreen-off" aria-hidden="true">⛶</span>
            <span class="btn-fullscreen-label">На весь экран</span>
          </button>
          <div id="ui-lang-picker" class="ui-lang-picker" role="radiogroup" aria-labelledby="menu-lang-label">
            <div id="menu-lang-label" class="ui-lang-label">Язык</div>
            <div class="ui-lang-segment">
              <label class="ui-lang-pill">
                <input type="radio" name="roof-leak-lang" id="opt-lang-ru" value="ru" checked />
                <span id="opt-lang-ru-label">RU</span>
              </label>
              <label class="ui-lang-pill">
                <input type="radio" name="roof-leak-lang" id="opt-lang-en" value="en" />
                <span id="opt-lang-en-label">EN</span>
              </label>
            </div>
          </div>
          <div id="ui-players-picker" class="ui-lang-picker" role="radiogroup" aria-labelledby="menu-player-label">
            <div id="menu-player-label" class="ui-lang-label">Игроки</div>
            <div class="ui-lang-segment">
              <label class="ui-lang-pill">
                <input type="radio" name="roof-leak-players" id="opt-players-1" value="1" />
                <span id="opt-players-1-label">1</span>
              </label>
              <label class="ui-lang-pill">
                <input type="radio" name="roof-leak-players" id="opt-players-2" value="2" checked />
                <span id="opt-players-2-label">2</span>
              </label>
            </div>
          </div>
          <a
            id="btn-gallery"
            class="btn-gallery"
            href="https://blagogames.com/games"
            rel="noopener noreferrer"
          >
            Галерея игр
          </a>
        </div>
        <div id="hud-game" class="hud-game is-hidden">
          <div id="game-over-overlay" class="game-over-overlay is-hidden" aria-live="assertive">GAME OVER</div>
          <h1 id="score-display">Поймано: 0</h1>
          <div class="hud-row">
            <span id="tracking-display">Покажите обе руки в кадре</span>
          </div>
          <div id="mug-timers" class="mug-timers is-hidden" aria-live="polite">
            <div id="mug-timer-p0" class="mug-timer-row is-hidden">
              <span class="mug-timer-name">Кружка</span>
              <div class="mug-timer-track"><div class="mug-timer-fill"></div></div>
            </div>
            <div id="mug-timer-p1" class="mug-timer-row is-hidden">
              <span class="mug-timer-name">Игрок 2 · кружка</span>
              <div class="mug-timer-track"><div class="mug-timer-fill"></div></div>
            </div>
          </div>
          <div id="water-meter" class="water-meter" aria-label="Уровень воды на полу">
            <div class="water-meter-track">
              <div id="water-meter-fill" class="water-meter-fill"></div>
              <div class="water-meter-mark" aria-hidden="true"></div>
            </div>
            <span id="water-meter-label" class="water-meter-label">0%</span>
          </div>
          <button type="button" id="btn-back-menu" class="btn-menu btn-back-menu">Меню</button>
        </div>
        <div id="main-menu" class="menu-overlay is-hidden">
          <canvas id="menu-drops-canvas" class="menu-drops-canvas" aria-hidden="true"></canvas>
          <div class="menu-panel">
            <div class="menu-hero menu-hero-roof-leak">
              <img id="menu-hero-image" class="menu-hero-image" src="" alt="Roof Leak" width="1344" height="768" decoding="async" />
            </div>
            <div class="menu-cta">
              <button type="button" id="btn-start" class="btn-start">Играть</button>
            </div>
            <div class="menu-options" role="group" aria-label="Опции">
              <div id="menu-options-title" class="menu-options-title">Звук и музыка</div>
              <div class="menu-volume-row">
                <label for="opt-volume" class="menu-volume-label">
                  <span id="menu-volume-title" class="menu-volume-title">Громкость</span>
                  <span id="opt-volume-value" class="menu-volume-value">100%</span>
                </label>
                <input
                  type="range"
                  id="opt-volume"
                  class="menu-volume-slider"
                  min="0"
                  max="100"
                  step="1"
                  value="100"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="100"
                />
              </div>
              <label class="menu-option-toggle">
                <input type="checkbox" id="opt-sound-off" class="menu-option-input" aria-label="Отключить звуки в игре" />
                <span class="menu-option-left">
                  <span class="menu-option-emoji" aria-hidden="true">
                    <span class="menu-option-emoji-on">🔊</span>
                    <span class="menu-option-emoji-off">🔇</span>
                  </span>
                  <span class="menu-option-text">
                    <span id="menu-sounds-title" class="menu-option-title">Звуки в игре</span>
                  </span>
                </span>
                <span class="menu-option-switch" aria-hidden="true"><span class="menu-option-knob"></span></span>
              </label>
              <label class="menu-option-toggle">
                <input type="checkbox" id="opt-music-off" class="menu-option-input" aria-label="Отключить музыку" />
                <span class="menu-option-left">
                  <span class="menu-option-emoji" aria-hidden="true">
                    <span class="menu-option-emoji-on">🎵</span>
                    <span class="menu-option-emoji-off">🔇</span>
                  </span>
                  <span class="menu-option-text">
                    <span id="menu-music-title" class="menu-option-title">Музыка</span>
                    <span id="menu-music-desc" class="menu-option-desc">Меню и игра</span>
                  </span>
                </span>
                <span class="menu-option-switch" aria-hidden="true"><span class="menu-option-knob"></span></span>
              </label>
            </div>
          </div>
        </div>
        <div id="menu-hand-cursor" class="menu-hand-cursor is-hidden" aria-hidden="true">
          <svg class="menu-hand-cursor-progress" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="menu-hand-cursor-track" cx="24" cy="24" r="20" />
            <circle class="menu-hand-cursor-fill" cx="24" cy="24" r="20" pathLength="1" />
          </svg>
          <span class="menu-hand-cursor-dot"></span>
        </div>
        <div id="loading" class="visible">
          <div id="loading-text">Загрузка моделей…</div>
          <div id="progress-container">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
